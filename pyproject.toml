[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "context-guardian"
version = "0.1.0"
description = "Local-first context lifecycle runtime for coding agents"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
cg = "context_guardian.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
